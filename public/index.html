<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immigration and Secure Client Portal Terminal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; color: #000000; }
        .portal-container { max-width: 800px; margin: 20px auto; padding: 10px; }
        .gov-header { font-size: 16px; color: #333; margin-bottom: 20px; font-weight: normal; }
        h1 { font-size: 32px; font-weight: bold; margin: 10px 0 20px 0; font-family: Georgia, serif; }
        
        /* Navigation tab styling to match your exact upload layout */
        .nav-tabs { margin-bottom: 25px; display: flex; gap: 8px; }
        .nav-tabs button { padding: 8px 14px; background: #f0f0f0; border: 1px solid #ccc; font-size: 14px; cursor: pointer; border-radius: 3px; font-weight: 500; }
        .nav-tabs button:hover { background: #e5e5e5; }
        
        h2 { font-size: 24px; font-weight: bold; margin-top: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 180px; font-size: 16px; font-weight: 500; }
        input[type="text"], input[type="email"], input[type="password"] { padding: 6px 10px; width: 300px; border: 1px solid #767676; font-size: 14px; border-radius: 2px; }
        
        .submit-btn { padding: 6px 12px; background: #efefef; border: 1px solid #767676; font-size: 14px; cursor: pointer; border-radius: 3px; margin-top: 15px; display: block; }
        .submit-btn:hover { background: #e5e5e5; }
        .output-box { display: none; margin-top: 20px; max-width: 500px; }
    </style>
</head>
<body>

<div class="portal-container">
    <div class="gov-header">Government of Canada</div>
    <h1>Immigration and Secure Client Portal Terminal</h1>

    <div class="nav-tabs">
        <button type="button" onclick="window.showPanel('loginPanel')">Access Existing Account</button>
        <button type="button" onclick="window.showPanel('registerPanel')">Create Secure Account Profiling File</button>
        <button type="button" onclick="window.showPanel('trackPanel')">Track File Status</button>
    </div>

    <div id="loginPanel" class="panel">
        <h2>Account Secure Gateway Sign-In</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Account Security Password</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="submit-btn">Verify and Sign In</button>
        </form>
    </div>

    <div id="registerPanel" class="panel" style="display:none;">
        <h2>Create Secure Account File Registry</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Legal Full Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Account Security Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Execute Processing Enrollment Registry</button>
        </form>
    </div>

    <div id="trackPanel" class="panel" style="display:none;">
        <h2>File Status Tracking Gateway</h2>
        <form id="trackForm">
            <div class="form-group">
                <label>Unique Client ID (UCI)</label>
                <input type="text" id="uciInput" placeholder="UCI-XXXXXXXX" required>
            </div>
            <button type="submit" class="submit-btn">Query Directory Archives</button>
        </form>
        <div id="trackingResult" class="output-box"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
