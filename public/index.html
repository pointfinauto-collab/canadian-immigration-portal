<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immigration and Secure Client Portal Terminal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .portal-wrapper { max-width: 650px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 6px solid #c8102e; }
        .branding { font-size: 14px; color: #666; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
        h1 { margin: 0 0 25px 0; font-size: 26px; color: #111; font-weight: 700; }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; padding: 10px 15px; font-size: 15px; cursor: pointer; font-weight: 600; color: #666; border-radius: 4px; transition: all 0.2s; }
        .tab-btn.active { background: #c8102e; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        .action-btn { background: #c8102e; color: white; border: none; width: 100%; padding: 12px; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; transition: background 0.2s; margin-top: 10px; }
        .action-btn:hover { background: #a60d25; }
        .action-btn:disabled { background: #ccc; cursor: not-allowed; }
        .output-box { display: none; margin-top: 20px; padding: 15px; border-radius: 4px; border-left: 5px solid #c8102e; background: #fafafa; }
    </style>
</head>
<body>

<div class="portal-wrapper">
    <div class="branding">Government of Canada / Ref Model Layout</div>
    <h1>Immigration and Secure Client Portal Terminal</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Account Gateway Sign-In</button>
        <button class="tab-btn" onclick="switchTab('register')">Create Secure Account</button>
        <button class="tab-btn" onclick="switchTab('track')">Track Status Link</button>
    </div>

    <div id="loginPanel" class="panel active">
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label>Account Security Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="action-btn">Verify and Sign In</button>
        </form>
    </div>

    <div id="registerPanel" class="panel">
        <form id="registerForm">
            <div class="form-group">
                <label>Legal Full Name</label>
                <input type="text" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="john.doe@example.com">
            </div>
            <div class="form-group">
                <label>Establish System Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="action-btn">Execute Processing Enrollment Registry</button>
        </form>
    </div>

    <div id="trackPanel" class="panel">
        <form id="trackForm">
            <div class="form-group">
                <label>Enter Generated Unique Client Identifier (UCI)</label>
                <input type="text" id="uciInput" required placeholder="UCI-12345678">
            </div>
            <button type="submit" class="action-btn">Query Directory Archives</button>
        </form>
        <div id="trackingResult" class="output-box"></div>
    </div>
</div>

<script src="app.js"></script>
<script>
    function switchTab(panelName) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(panelName + 'Panel').classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
