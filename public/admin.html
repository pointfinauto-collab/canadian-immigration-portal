<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrative Registry Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #c8102e; }
        h1 { color: #333; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #c8102e; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .badge { background: #e1f5fe; color: #0288d1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; font-family: monospace; }
        select, textarea { width: 100%; padding: 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        .btn { background: #2e7d32; color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn:hover { background: #1b5e20; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>🔒 Administrative Registry Control Panel</h1>
        <p>Review active enrollment profile databases live from MongoDB cloud service layers.</p>
        
        <table>
            <thead>
                <tr>
                    <th>Applicant Details</th>
                    <th>File Identifiers</th>
                    <th>Current Processing Status</th>
                    <th>Officer Assessment Notes</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="5" style="text-align:center;">Synchronizing live database stream rows...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        async function loadAdminData() {
            try {
                const response = await fetch(`${API_BASE}/admin/enrollments`);
                const data = await response.json();
                
                const tableBody = document.getElementById('adminTableBody');
                tableBody.innerHTML = ''; 
                
                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No enrollment data found in cloud cluster.</td></tr>`;
                    return;
                }

                data.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${user.name}</strong><br><small style="color:#666;">${user.email}</small></td>
                        <td>
                            UCI: <span class="badge">${user.uciNumber}</span><br>
                            Ref: <span class="badge">${user.trackingRef}</span>
                        </td>
                        <td>
                            <select id="status-${user._id}">
                                <option value="Submitted / Review Pending" ${user.status === 'Submitted / Review Pending' ? 'selected' : ''}>Submitted / Review Pending</option>
                                <option value="Biometrics Verification Stage" ${user.status === 'Biometrics Verification Stage' ? 'selected' : ''}>Biometrics Verification Stage</option>
                                <option value="Background Eligibility Check" ${user.status === 'Background Eligibility Check' ? 'selected' : ''}>Background Eligibility Check</option>
                                <option value="Registry Profile Approved" ${user.status === 'Registry Profile Approved' ? 'selected' : ''}>Registry Profile Approved</option>
                                <option value="Refusal Issued" ${user.status === 'Refusal Issued' ? 'selected' : ''}>Refusal Issued</option>
                            </select>
                        </td>
                        <td>
                            <textarea id="notes-${user._id}" rows="2">${user.adminNotes || ''}</textarea>
                        </td>
                        <td>
                            <button class="btn" onclick="updateDecision('${user._id}')">Update File</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                document.getElementById('adminTableBody').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Failed to stream data files from database.</td></tr>`;
            }
        }

        async function updateDecision(id) {
            const status = document.getElementById(`status-${id}`).value;
            const adminNotes = document.getElementById(`notes-${id}`).value;

            try {
                const res = await fetch(`${API_BASE}/admin/decision`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status, adminNotes })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Official status record modified successfully!');
                    loadAdminData();
                } else {
                    alert('Update failed.');
                }
            } catch (err) {
                alert('Communication error with network nodes.');
            }
        }
        
        window.onload = loadAdminData;
    </script>
</body>
</html>
